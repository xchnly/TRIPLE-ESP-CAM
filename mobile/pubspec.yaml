publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  geolocator: ^14.0.1
  http: ^1.6.0
